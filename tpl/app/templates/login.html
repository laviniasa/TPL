<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - TPL</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

    <link rel="manifest"
          href="{{ url_for('static', filename='manifest.json') }}">

    <meta name="theme-color" content="#0875c9">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="TPL">

    <link rel="apple-touch-icon"
          href="{{ url_for('static', filename='icons/apple-touch-icon.png') }}">

    <style>
        #tpl-splash {
            position: fixed;
            inset: 0;
            z-index: 99999;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(180deg, #0875c9 0%, #005ca8 100%);
            opacity: 1;
            visibility: visible;
            transition: opacity .35s ease, visibility .35s ease;
        }

        #tpl-splash.ocultar {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .tpl-splash-conteudo {
            width: min(82vw, 330px);
            text-align: center;
            color: white;
            animation: tplSplashEntrada .55s ease-out;
        }

        .tpl-splash-carrinho {
            width: min(62vw, 230px);
            max-height: 52vh;
            object-fit: contain;
            display: block;
            margin: 0 auto 18px;
            filter: drop-shadow(0 10px 18px rgba(0,0,0,.22));
        }

        .tpl-splash-titulo {
            margin: 0;
            font-size: 42px;
            line-height: 1;
            font-weight: 800;
            letter-spacing: 2px;
        }

        .tpl-splash-subtitulo {
            margin: 10px 0 0;
            font-size: 16px;
            line-height: 1.35;
            font-weight: 500;
        }

        @keyframes tplSplashEntrada {
            from {
                opacity: 0;
                transform: translateY(12px) scale(.97);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            #tpl-splash {
                transition: none;
            }

            .tpl-splash-conteudo {
                animation: none;
            }
        }
    </style>
</head>

<body>
    <div id="tpl-splash" aria-label="Abrindo TPL">
        <div class="tpl-splash-conteudo">
            <img
                src="{{ url_for('static', filename='icons/apple-touch-icon.png') }}"
                alt="Carrinho TPL"
                class="tpl-splash-carrinho"
            >
            <h1 class="tpl-splash-titulo">TPL</h1>
            <p class="tpl-splash-subtitulo">Testemunho Público Local</p>
        </div>
    </div>

    <div class="container">
        <h1>Testemunho Público Local</h1>
        <h2>Entrar</h2>

        {% with mensagens = get_flashed_messages() %}
            {% if mensagens %}
                {% for mensagem in mensagens %}
                    <div class="mensagem">{{ mensagem }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST">
            <div>
                <label for="email">E-mail</label>
                <input type="email" id="email" name="email"
                       required autocomplete="email">
            </div>

            <div>
                <label for="senha">Senha</label>
                <input type="password" id="senha" name="senha"
                       required autocomplete="current-password">
            </div>

            <button type="submit">Entrar</button>
        </form>
    </div>

    <script>
        window.addEventListener("load", function () {
            const splash = document.getElementById("tpl-splash");
            if (!splash) return;

            setTimeout(function () {
                splash.classList.add("ocultar");

                setTimeout(function () {
                    splash.remove();
                }, 400);
            }, 1200);
        });
    </script>
</body>
</html>
