<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Entrar - TPL</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >

    <style>
        * {
            box-sizing: border-box;
        }

        body.login-page {
            margin: 0;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: linear-gradient(145deg, #0757a6 0%, #0875c9 48%, #0b8bd8 100%);
            font-family: Arial, Helvetica, sans-serif;
        }

        .login-wrapper {
            width: 100%;
            max-width: 410px;
        }

        .login-card {
            background: #ffffff;
            border-radius: 24px;
            padding: 34px 28px 28px;
            box-shadow: 0 18px 45px rgba(0, 0, 0, 0.20);
        }

        .login-brand {
            text-align: center;
            margin-bottom: 28px;
        }

        .login-logo {
            width: 78px;
            height: 78px;
            margin: 0 auto 16px;
            border-radius: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0875c9;
            color: #ffffff;
            font-size: 28px;
            font-weight: 800;
            letter-spacing: 1px;
            box-shadow: 0 8px 20px rgba(8, 117, 201, 0.25);
        }

        .login-brand h1 {
            margin: 0;
            color: #172033;
            font-size: 25px;
            line-height: 1.15;
            font-weight: 800;
        }

        .login-brand p {
            margin: 8px 0 0;
            color: #667085;
            font-size: 14px;
        }

        .login-titulo {
            margin: 0 0 20px;
            color: #172033;
            font-size: 20px;
            font-weight: 700;
        }

        .login-campo {
            margin-bottom: 16px;
        }

        .login-campo label {
            display: block;
            margin-bottom: 7px;
            color: #344054;
            font-size: 13px;
            font-weight: 700;
        }

        .login-input-wrap {
            position: relative;
        }

        .login-input {
            width: 100%;
            height: 50px;
            padding: 0 15px;
            border: 1px solid #d0d5dd;
            border-radius: 12px;
            background: #f9fafb;
            color: #172033;
            font-size: 15px;
            outline: none;
            transition: 0.2s ease;
        }

        .login-input:focus {
            border-color: #0875c9;
            background: #ffffff;
            box-shadow: 0 0 0 3px rgba(8, 117, 201, 0.12);
        }

        .login-input.senha {
            padding-right: 52px;
        }

        .mostrar-senha {
            position: absolute;
            top: 50%;
            right: 7px;
            transform: translateY(-50%);
            width: 40px;
            height: 38px;
            border: 0;
            border-radius: 9px;
            background: transparent;
            color: #667085;
            cursor: pointer;
            font-size: 17px;
        }

        .mostrar-senha:hover {
            background: #eef4f8;
        }

        .mensagem-login {
            margin-bottom: 18px;
            padding: 12px 13px;
            border-radius: 11px;
            background: #fff1f0;
            border: 1px solid #ffd5d2;
            color: #b42318;
            font-size: 13px;
            line-height: 1.4;
        }

        .botao-entrar {
            width: 100%;
            height: 50px;
            margin-top: 7px;
            border: 0;
            border-radius: 12px;
            background: #0875c9;
            color: #ffffff;
            font-size: 15px;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 7px 16px rgba(8, 117, 201, 0.22);
            transition: 0.2s ease;
        }

        .botao-entrar:hover {
            background: #0668b3;
            transform: translateY(-1px);
        }

        .botao-entrar:active {
            transform: translateY(0);
        }

        .login-rodape {
            margin-top: 22px;
            text-align: center;
            color: #98a2b3;
            font-size: 11px;
        }

        @media (max-width: 480px) {
            body.login-page {
                padding: 14px;
                align-items: center;
            }

            .login-card {
                padding: 28px 20px 22px;
                border-radius: 20px;
            }

            .login-logo {
                width: 70px;
                height: 70px;
                border-radius: 19px;
                font-size: 25px;
            }

            .login-brand h1 {
                font-size: 22px;
            }

            .login-brand p {
                font-size: 13px;
            }
        }
    </style>
</head>

<body class="login-page">

    <main class="login-wrapper">

        <section class="login-card">

            <div class="login-brand">
                <div class="login-logo" aria-label="TPL">
                    TPL
                </div>

                <h1>Testemunho Público Local</h1>

                <p>Agenda dos carrinhos</p>
            </div>

            <h2 class="login-titulo">Entrar</h2>

            {% with mensagens = get_flashed_messages() %}
                {% if mensagens %}
                    {% for mensagem in mensagens %}
                        <div class="mensagem-login" role="alert">
                            {{ mensagem }}
                        </div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <form method="POST">

                <div class="login-campo">
                    <label for="email">E-mail</label>

                    <input
                        class="login-input"
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Digite seu e-mail"
                        required
                        autocomplete="email"
                        autofocus
                    >
                </div>

                <div class="login-campo">
                    <label for="senha">Senha</label>

                    <div class="login-input-wrap">
                        <input
                            class="login-input senha"
                            type="password"
                            id="senha"
                            name="senha"
                            placeholder="Digite sua senha"
                            required
                            autocomplete="current-password"
                        >

                        <button
                            type="button"
                            class="mostrar-senha"
                            id="botao-mostrar-senha"
                            aria-label="Mostrar senha"
                            title="Mostrar senha"
                        >
                            👁
                        </button>
                    </div>
                </div>

                <button type="submit" class="botao-entrar">
                    ENTRAR
                </button>

            </form>

            <div class="login-rodape">
                TPL • Testemunho Público Local
            </div>

        </section>

    </main>

    <script>
        const campoSenha = document.getElementById("senha");
        const botaoMostrarSenha =
            document.getElementById("botao-mostrar-senha");

        botaoMostrarSenha.addEventListener("click", function () {
            const senhaVisivel = campoSenha.type === "text";

            campoSenha.type = senhaVisivel ? "password" : "text";

            this.textContent = senhaVisivel ? "👁" : "🙈";
            this.setAttribute(
                "aria-label",
                senhaVisivel ? "Mostrar senha" : "Ocultar senha"
            );
            this.setAttribute(
                "title",
                senhaVisivel ? "Mostrar senha" : "Ocultar senha"
            );
        });
    </script>

</body>
</html>
