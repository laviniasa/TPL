<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Entrar - TPL</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

    <link rel="manifest"
          href="{{ url_for('static', filename='manifest.json') }}">

    <meta name="theme-color" content="#0875c9">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="TPL">

    <link rel="apple-touch-icon"
          href="{{ url_for('static', filename='icons/apple-touch-icon.png') }}">

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            min-height: 100%;
        }

        body {
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                         Roboto, Helvetica, Arial, sans-serif;
            background: #f4f6f8;
            color: #17212b;
        }

        .login-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 28px 18px;
        }

        .login-card {
            width: 100%;
            max-width: 430px;
            background: #ffffff;
            border-radius: 18px;
            padding: 32px 26px 28px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.10);
        }

        .login-logo {
            width: 92px;
            height: 92px;
            object-fit: contain;
            display: block;
            margin: 0 auto 18px;
        }

        .login-title {
            margin: 0;
            text-align: center;
            font-size: 28px;
            line-height: 1.15;
            font-weight: 700;
            color: #17212b;
        }

        .login-subtitle {
            margin: 8px 0 28px;
            text-align: center;
            color: #5d6872;
            font-size: 15px;
        }

        .login-heading {
            margin: 0 0 20px;
            font-size: 22px;
            font-weight: 650;
            color: #17212b;
        }

        .mensagem {
            margin: 0 0 18px;
            padding: 12px 14px;
            border-radius: 10px;
            background: #fff3cd;
            color: #664d03;
            font-size: 14px;
            line-height: 1.4;
        }

        .login-form {
            display: flex;
            flex-direction: column;
            gap: 17px;
        }

        .campo {
            display: flex;
            flex-direction: column;
            gap: 7px;
        }

        .campo label {
            font-size: 15px;
            font-weight: 600;
            color: #26333d;
        }

        .campo input {
            width: 100%;
            min-height: 50px;
            padding: 12px 14px;
            border: 1px solid #c8d0d7;
            border-radius: 10px;
            background: #ffffff;
            color: #17212b;
            font-size: 16px;
            outline: none;
            transition: border-color .2s, box-shadow .2s;
        }

        .campo input:focus {
            border-color: #0875c9;
            box-shadow: 0 0 0 3px rgba(8, 117, 201, .14);
        }

        .login-button {
            width: 100%;
            min-height: 52px;
            margin-top: 4px;
            border: 0;
            border-radius: 10px;
            background: #0875c9;
            color: #ffffff;
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
        }

        .login-button:active {
            transform: translateY(1px);
        }

        /* ===== TELA DE ABERTURA TPL ===== */
        #tpl-splash {
            position: fixed;
            inset: 0;
            z-index: 99999;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0875c9;
            opacity: 1;
            visibility: visible;
            transition: opacity .35s ease, visibility .35s ease;
        }

        #tpl-splash.ocultar {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .tpl-splash-conteudo {
            width: min(82vw, 360px);
            text-align: center;
            animation: tplSplashEntrada .55s ease-out;
        }

        .tpl-splash-carrinho {
            width: min(68vw, 270px);
            max-height: 58vh;
            object-fit: contain;
            display: block;
            margin: 0 auto;
        }

        .tpl-splash-subtitulo {
            margin: 18px 0 0;
            color: #ffffff;
            font-size: 30px;
            line-height: 1;
            font-weight: 700;
            letter-spacing: 1px;
        }

        @keyframes tplSplashEntrada {
            from {
                opacity: 0;
                transform: translateY(12px) scale(.97);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @media (max-width: 480px) {
            .login-page {
                align-items: flex-start;
                padding: 24px 14px;
            }

            .login-card {
                margin-top: 8vh;
                padding: 28px 20px 24px;
                border-radius: 16px;
            }

            .login-logo {
                width: 82px;
                height: 82px;
            }

            .login-title {
                font-size: 26px;
            }

            .login-subtitle {
                margin-bottom: 24px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            #tpl-splash {
                transition: none;
            }

            .tpl-splash-conteudo {
                animation: none;
            }
        }
    </style>
</head>

<body>

    <!-- TELA DE ABERTURA TPL -->
    <div id="tpl-splash" aria-label="Abrindo TPL">
        <div class="tpl-splash-conteudo">
            <img
                src="{{ url_for('static', filename='icons/icon-512.png') }}"
                alt="Carrinho TPL"
                class="tpl-splash-carrinho"
            >
            <p class="tpl-splash-subtitulo">TPL</p>
        </div>
    </div>

    <main class="login-page">
        <section class="login-card">

            <img
                src="{{ url_for('static', filename='icons/icon-192.png') }}"
                alt="TPL"
                class="login-logo"
            >

            <h1 class="login-title">TPL</h1>

            <p class="login-subtitle">
                Testemunho Público Local
            </p>

            <h2 class="login-heading">Entrar</h2>

            {% with mensagens = get_flashed_messages() %}
                {% if mensagens %}
                    {% for mensagem in mensagens %}
                        <div class="mensagem">{{ mensagem }}</div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <form method="POST" class="login-form">
                <div class="campo">
                    <label for="email">E-mail</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        required
                        autocomplete="email"
                        inputmode="email"
                    >
                </div>

                <div class="campo">
                    <label for="senha">Senha</label>
                    <input
                        type="password"
                        id="senha"
                        name="senha"
                        required
                        autocomplete="current-password"
                    >
                </div>

                <button type="submit" class="login-button">
                    Entrar
                </button>
            </form>

        </section>
    </main>

    <script>
        /* ===== FECHA A TELA DE ABERTURA ===== */
        window.addEventListener("load", function () {
            const splash = document.getElementById("tpl-splash");

            if (!splash) {
                return;
            }

            setTimeout(function () {
                splash.classList.add("ocultar");

                setTimeout(function () {
                    splash.remove();
                }, 400);

            }, 1000);
        });
    </script>

</body>
</html>
